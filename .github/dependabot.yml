version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    rebase-strategy: "auto"
    labels:
      - "⬆️ dependencies"
    assignees:
      - "jamiefdhurst"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    ignore:
      # Keep Obsidian at current version - controlled via package.json overrides
      - dependency-name: "obsidian"
      # Prevent major TypeScript version bumps - managed manually
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      # Single group for all dev dependencies - one PR per cycle rather than
      # several, since everything here is a build/test tool
      dev-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    rebase-strategy: "auto"
    labels:
      - "⬆️ dependencies"
    assignees:
      - "jamiefdhurst"
    commit-message:
      prefix: "chore"
      include: "scope"
